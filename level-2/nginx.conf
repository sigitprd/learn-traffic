events {
    worker_connections 1024;
}

http {
    # default load balancing method = round robin (no directive needed,
    # it's the default when no "least_conn"/"ip_hash"/"hash" is set)
    upstream go_api_backend {
        server api-1:8080;
        server api-2:8080;
        server api-3:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://go_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # kalau backend down, coba backend lain otomatis
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
        }
    }
}
